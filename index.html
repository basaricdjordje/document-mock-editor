<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Mock Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf5;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1219;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .doc-type-picker {
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(160deg, #1a2a42 0%, #121c2b 100%);
      border: 1px solid #3d5f94;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .doc-type-picker__title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #93c5fd;
      margin-bottom: 10px;
    }

    .doc-type-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-type-option__label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .fields-section {
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .fields-section__title {
      margin: 0 0 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
      font-family: inherit;
    }

    .field-group {
      margin-bottom: 4px;
    }

    .field-group.advanced {
      display: none;
    }

    .field-group.advanced.visible {
      display: block;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: #243044;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: #2d3f58; }

    .btn-secondary.active {
      background: #1e3a5f;
      border-color: var(--accent);
      color: #bfdbfe;
    }

    .doc-type-option {
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1018;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      margin-bottom: 0;
    }

    .doc-type-option:hover {
      border-color: #4b6b9a;
      background: #101a28;
    }

    .doc-type-option.selected {
      border-color: var(--accent);
      background: #173054;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .preview-pane {
      overflow: auto;
      padding: 24px;
      background: #080b10;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .preview-toolbar h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    #preview-root {
      display: inline-block;
      min-width: min-content;
    }

    #preview-root .photo-scene {
      min-height: auto !important;
      padding: 32px 24px !important;
    }

    #preview-root .delivery-order-scene {
      min-height: auto !important;
      padding: 20px !important;
      background: #d8d8d8 !important;
    }

    #preview-root .handwritten {
      color: #1a4fd6;
    }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { max-height: none; position: static; }
    }
  </style>
  <style id="document-styles"></style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="doc-type-picker">
        <div class="doc-type-picker__title">Document type</div>
        <div class="doc-type-options" id="doc-type-options"></div>
      </div>

      <div class="fields-section">
        <div class="fields-section__title">Fields</div>
        <div id="fields"></div>
      </div>

      <div class="actions">
        <button type="button" id="toggle-advanced" class="btn-secondary">Show all fields</button>
        <button type="button" id="download-png" class="btn-primary">Download image</button>
        <span class="status" id="status"></span>
      </div>
    </aside>

    <main class="preview-pane">
      <div class="preview-toolbar">
        <h2>Preview</h2>
      </div>
      <div id="preview-root"></div>
    </main>
  </div>

    function compareFieldKeys(a, b) {
      const aOrder = FIELD_ORDER_INDEX.has(a) ? FIELD_ORDER_INDEX.get(a) : 9999;
      const bOrder = FIELD_ORDER_INDEX.has(b) ? FIELD_ORDER_INDEX.get(b) : 9999;
      if (aOrder !== bOrder) return aOrder - bOrder;
      return a.localeCompare(b);
    }

    function getFormFieldKeys(config) {
      const primarySet = new Set(config.primary);
      const allKeys = Object.keys(config.defaults).sort(compareFieldKeys);
      const primary = config.primary.filter((key) => allKeys.includes(key));
      const advanced = allKeys.filter((key) => !primarySet.has(key));
      return [...primary, ...advanced];

    const EXPORT_MAX_LONG_EDGE = 1800;
    const EXPORT_MAX_BYTES = 900_000;
    const EXPORT_JPEG_QUALITIES = [0.92, 0.88, 0.84, 0.8, 0.76];

    function estimateDataUrlBytes(dataUrl) {
      const base64 = dataUrl.split(",")[1] || "";
      return Math.ceil(base64.length * 0.75);
    }

    function downscaleCanvas(sourceCanvas, maxLongEdge) {
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      const longEdge = Math.max(width, height);
      if (longEdge <= maxLongEdge) {
        return sourceCanvas;
      }

      const scale = maxLongEdge / longEdge;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    function flattenCanvas(sourceCanvas) {
      const canvas = document.createElement("canvas");
      canvas.width = sourceCanvas.width;
      canvas.height = sourceCanvas.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sourceCanvas, 0, 0);
      return canvas;
    }

    function compressCanvasForDownload(sourceCanvas) {
      const resized = downscaleCanvas(sourceCanvas, EXPORT_MAX_LONG_EDGE);
      const flattened = flattenCanvas(resized);
      let best = null;

      for (const quality of EXPORT_JPEG_QUALITIES) {
        const dataUrl = flattened.toDataURL("image/jpeg", quality);
        const bytes = estimateDataUrlBytes(dataUrl);
        best = { dataUrl, bytes, quality };
        if (bytes <= EXPORT_MAX_BYTES) {
          break;
        }
      }

      return best;
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      if (key === "date" && (state.docType === "interchange_in" || state.docType === "interchange_out")) {
        return "Timestamp";

      return FIELD_LABELS[key] || key.replace(/_/g, " ");

    function parseNumber(value) {
      const cleaned = String(value ?? "").replace(/[^\d.-]/g, "");
      const parsed = Number.parseFloat(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatMoney(value) {
      return `$${parseNumber(value).toFixed(2)}`;

    function formatLb(value) {
      return `${Math.round(parseNumber(value)).toLocaleString("en-US")} lb`;

    function formatKgFromLb(value) {
      const kg = Math.round(parseNumber(value) / 2.20462);
      return `${kg.toLocaleString("en-US")} kg`;
    }

    function terminalLines(terminal) {
      const parts = String(terminal ?? "").trim().split(/\s+/);
      if (parts.length >= 2) {
        return [parts[0].toUpperCase(), parts.slice(1).join(" ").toUpperCase()];
      }
      return [String(terminal ?? "").toUpperCase(), "T E R M I N A L"];
    }

    function multilineHtml(text) {
      return String(text ?? "")
        .split(/\r?\n/)
        .map((line) => esc(line))

      return parseNumber(String(value ?? "").replace(/\s*lb\s*$/i, ""));
    }

    function formatWeightTotal(value) {
      return parseWeightNumber(value).toFixed(2);

    function formatWeightDisplay(value) {
      return Math.round(parseNumber(value)).toLocaleString("en-US");

    function barcodeSvg(value, height = 54) {
      let bars = "";
      let x = 10;
      const seed = `${value}*`;
      for (let index = 0; index < seed.length; index += 1) {
        const bits = ((seed.charCodeAt(index) * 17 + index * 11) % 256).toString(2).padStart(8, "0");
        for (const bit of bits) {
          const width = bit === "1" ? 3 : 2;
          if (bit === "1") {
            bars += `<rect x="${x}" y="0" width="${width}" height="${height}" fill="#000"/>`;
          }
          x += width + 1;
        }
      }
      const width = x + 10;
      return `<svg class="barcode" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" aria-label="Barcode ${esc(value)}">${bars}</svg>`;
    }

    const state = { docType: "interchange_out" };

    function currentConfig() {
      return DOCUMENT_TYPES[state.docType];
    }

    function getValues() {
      const config = currentConfig();
      const values = { ...config.defaults };
      for (const key of Object.keys(config.defaults)) {
        if (formValues[key] !== undefined) {
          values[key] = formValues[key];
        }
      }
      return values;
    }

    function buildForm() {
      const config = currentConfig();
      const fieldsEl = document.getElementById("fields");
      fieldsEl.innerHTML = "";

      const keys = getFormFieldKeys(config);
      for (const key of keys) {
        const isPrimary = config.primary.includes(key);
        const group = document.createElement("div");
        group.className = `field-group${isPrimary ? "" : " advanced"}`;
        if (!isPrimary && showAdvanced) {
          group.classList.add("visible");
        }

        const label = document.createElement("label");
        label.setAttribute("for", `field-${key}`);
        label.textContent = fieldLabel(key);
        group.appendChild(label);

        const current = getValues()[key] ?? "";
        let input;
        if (LONG_FIELDS.has(key)) {
          input = document.createElement("textarea");
          input.value = current;
        } else {
          input = document.createElement("input");
          input.type = "text";
          input.value = current;
        }
        input.id = `field-${key}`;
        input.dataset.key = key;
        input.addEventListener("input", () => {
          formValues[key] = input.value;
          renderPreview();
        });
        group.appendChild(input);
        fieldsEl.appendChild(group);
      }
    }

    function renderPreview() {
      const config = currentConfig();
      document.getElementById("document-styles").textContent = config.css;
      const values = getValues();
      document.getElementById("preview-root").innerHTML = config.render(values);
    }

    function setDocType(docType) {
      state.docType = docType;
      formValues = {};
      document.querySelectorAll(".doc-type-option").forEach((button) => {
        button.classList.toggle("selected", button.dataset.docType === docType);
      });
      buildForm();
      renderPreview();
    }

    function initDocTypeSelect() {
      const container = document.getElementById("doc-type-options");
      container.innerHTML = "";
      for (const [key, config] of Object.entries(DOCUMENT_TYPES)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `doc-type-option${key === state.docType ? " selected" : ""}`;
        button.dataset.docType = key;
        button.innerHTML = `<span class="doc-type-option__label">${esc(config.label)}</span>`;
        container.appendChild(button);
      }

      container.onclick = (event) => {
        const button = event.target.closest(".doc-type-option");
        if (!button) return;
        setDocType(button.dataset.docType);
      };
    }

    document.getElementById("toggle-advanced").addEventListener("click", () => {
      showAdvanced = !showAdvanced;
      const btn = document.getElementById("toggle-advanced");
      btn.textContent = showAdvanced ? "Hide extra fields" : "Show all fields";
      btn.classList.toggle("active", showAdvanced);
      document.querySelectorAll(".field-group.advanced").forEach((el) => {
        el.classList.toggle("visible", showAdvanced);
      });
    });

    document.getElementById("download-png").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const target = document.querySelector("#preview-root #capture-target");
      if (!target || typeof html2canvas !== "function") {
        status.textContent = "Preview is not ready for export.";
        return;
      }

      status.textContent = "Generating image...";
      try {
        const canvas = await html2canvas(target, {
          backgroundColor: null,
          scale: 1.5,
          useCORS: true,
          logging: false,
        });
        const compressed = compressCanvasForDownload(canvas);
        if (!compressed) {
          status.textContent = "Export failed: could not compress image.";
          return;
        }
        const config = currentConfig();
        const values = getValues();
        const link = document.createElement("a");
        link.download = config.filename(values);
        link.href = compressed.dataUrl;
        link.click();
        status.textContent = "Image downloaded.";
      } catch (error) {
        status.textContent = `Export failed: ${error.message}`;
      }
    });

    initDocTypeSelect();
    buildForm();
    renderPreview();
  </script>
